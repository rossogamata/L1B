---
- name: Prepare Ubuntu hosts and install Kubernetes packages
  hosts: k8s_cluster
  become: true
  roles:
    - common
    - containerd
    - kubernetes

- name: Bootstrap the control plane
  hosts: k8s_control_plane
  become: true
  roles:
    - control_plane
    - cni

- name: Join worker nodes
  hosts: k8s_workers
  become: true
  roles:
    - worker

- name: Verify the cluster
  hosts: k8s_control_plane
  become: true
  tasks:
    - name: Wait until every node is Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - wait
          - --for=condition=Ready
          - node
          - --all
          - --timeout=300s
      changed_when: false

    - name: Show registered nodes
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - nodes
          - -o
          - wide
      register: cluster_nodes
      changed_when: false

    - name: Print node status
      ansible.builtin.debug:
        var: cluster_nodes.stdout_lines
