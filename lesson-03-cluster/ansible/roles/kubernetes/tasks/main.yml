---
- name: Install Kubernetes repository prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes package signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: "/tmp/kubernetes-{{ kubernetes_minor }}-Release.key"
    owner: root
    group: root
    mode: "0644"

- name: Convert the Kubernetes signing key to a keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --batch
      - --yes
      - --output
      - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      - "/tmp/kubernetes-{{ kubernetes_minor }}-Release.key"
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Configure the Kubernetes minor-version repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/"
    suites: /
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: present

- name: Install kubelet, kubeadm, and kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Hold Kubernetes packages at the installed versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Enable kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
    state: started
