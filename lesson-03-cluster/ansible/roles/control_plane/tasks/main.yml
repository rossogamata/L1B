---
- name: Write kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Initialize the control plane once
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config=/etc/kubernetes/kubeadm-config.yaml
    creates: /etc/kubernetes/admin.conf
  no_log: true

- name: Create kubeconfig directory for the SSH user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install administrator kubeconfig for the SSH user on the control plane
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Create a short-lived worker join command
  ansible.builtin.command:
    argv:
      - kubeadm
      - token
      - create
      - --ttl=30m
      - --print-join-command
  register: kubeadm_join_result
  changed_when: true
  no_log: true
  when: groups['k8s_workers'] | length > 0

- name: Keep the join command in Ansible memory for the worker play
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ kubeadm_join_result.stdout }}"
  no_log: true
  when: groups['k8s_workers'] | length > 0
