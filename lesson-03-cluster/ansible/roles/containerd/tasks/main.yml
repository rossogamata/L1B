---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate the default containerd configuration when absent
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
    creates: /etc/containerd/config.toml
  notify: Restart containerd

- name: Ensure the CRI plugin is enabled
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^disabled_plugins\s*=.*$'
    line: 'disabled_plugins = []'
  notify: Restart containerd

- name: Use the systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*SystemdCgroup\s*=\s*)false\s*$'
    replace: '\1true'
  notify: Restart containerd

- name: Verify the containerd cgroup setting
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - '^[[:space:]]*SystemdCgroup[[:space:]]*=[[:space:]]*true[[:space:]]*$'
      - /etc/containerd/config.toml
  changed_when: false

- name: Enable and start containerd
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true

- name: Apply pending containerd configuration
  ansible.builtin.meta: flush_handlers
